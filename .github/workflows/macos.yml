name: macOS
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ymfm
        run: ./tools/fetch_ymfm.sh
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
      - name: Build
        run: cmake --build build --parallel 3
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent build/PC98PLAYER.app build/PC98PLAYER-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PC98PLAYER-macOS-universal
          path: build/PC98PLAYER-macOS-universal.zip
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS Simulator
        run: ./build_ios.sh
      - name: Build unsigned iOS device app
        run: IOS_SDK=iphoneos ./build_ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PC98PLAYER-iOS-Simulator
          path: build/ios-iphonesimulator/Debug-iphonesimulator/PC98PLAYERiOS.app
